services:
  web:
    build: .
    command: ["npm", "run", "start:web"]
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "43117:43117"
    env_file: .env.local
    environment:
      SENTINEL_DB_PATH: /data/sentinel.sqlite
      PORT: 43117
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:43117/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    volumes:
      - sentinel-data:/data
  worker:
    build: .
    command: ["node", "--import", "tsx", "src/worker/main.ts"]
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env.local
    environment:
      SENTINEL_DB_PATH: /data/sentinel.sqlite
    volumes:
      - sentinel-data:/data
    depends_on:
      web:
        condition: service_healthy
  agent-worker:
    build: .
    command: ["node", "--import", "tsx", "src/worker/agents.ts"]
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env.local
    environment:
      SENTINEL_DB_PATH: /data/sentinel.sqlite
    volumes:
      - sentinel-data:/data
    depends_on:
      web:
        condition: service_healthy
volumes:
  sentinel-data:
